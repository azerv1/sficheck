default_stages: [pre-commit]  # hooks without their own `stages` run on commit only
exclude: ^\.claude/  # Claude Code local state; also gitignored

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run python hooks/timed.py ruff-check ruff check
        language: system
        pass_filenames: false
        verbose: true
      - id: ruff-format
        name: ruff format
        entry: uv run python hooks/timed.py ruff-format ruff format
        language: system
        pass_filenames: false
        verbose: true
      - id: mypy
        name: mypy
        entry: uv run python hooks/timed.py mypy mypy
        language: system
        pass_filenames: false
        verbose: true
      - id: complexipy
        name: complexipy
        entry: uv run python hooks/timed.py complexipy complexipy
        language: system
        pass_filenames: false
        verbose: true
      - id: vulture
        name: vulture
        entry: uv run python hooks/timed.py vulture vulture
        language: system
        pass_filenames: false
        verbose: true
      - id: deptry
        name: deptry
        entry: uv run python hooks/timed.py deptry deptry .
        language: system
        pass_filenames: false
        verbose: true
      - id: jscpd
        name: jscpd
        entry: uv run python hooks/timed.py jscpd npx --yes jscpd@4 sficheck scripts tests
        language: system
        pass_filenames: false
        verbose: true
        stages: [pre-push]
      - id: pip-audit
        name: pip-audit
        entry: >-
          uv run python hooks/timed.py pip-audit
          uv export --frozen --no-emit-project --quiet -o build/audit-req.txt
          && pip-audit -r build/audit-req.txt --disable-pip
        language: system
        pass_filenames: false
        verbose: true
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run python hooks/timed.py pytest pytest
        language: system
        pass_filenames: false
        verbose: true
        stages: [pre-push]
