name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Commit-stage hooks (ruff, mypy, complexipy, vulture, deptry)
        run: uvx prek run --all-files
      - name: Push-stage hooks (jscpd, pip-audit, pytest)
        run: uvx prek run --all-files --hook-stage pre-push

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --with tox-uv tox -e ${{ matrix.python }}
      - name: Smoke test against the real machine
        run: >-
          uv run --python ${{ matrix.python }} absolutely-proprietary --list-sources
          && uv run --python ${{ matrix.python }} absolutely-proprietary -q --format json --skip winget > /dev/null
        shell: bash
