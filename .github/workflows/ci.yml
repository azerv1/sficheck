name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy absolutely_proprietary tests scripts
      - run: uv run pytest -q
      - name: Smoke test against the real machine
        run: uv run absolutely-proprietary --list-sources && uv run absolutely-proprietary -q --format json --skip winget > /dev/null
        shell: bash
