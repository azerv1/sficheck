name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Commit-stage hooks (ruff, mypy, complexipy, vulture, deptry)
        run: uvx prek run --all-files
      - name: Push-stage hooks (jscpd, pip-audit, pytest)
        run: uvx prek run --all-files --hook-stage pre-push

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The smoke tests go first: uv run creates .venv as a directory, which tox leaves alone. Run after tox,
      # they would find the PEP 832 .venv redirect file tox writes, which uv rejects.
      - name: Smoke test against the real machine
        run: >-
          uv run --python ${{ matrix.python }} sficheck --list-sources
          && uv run --python ${{ matrix.python }} sficheck -q --format json --skip winget > /dev/null
        shell: bash
      - name: Smoke test the kernel, hypervisor, firmware and hardware layers
        run: >-
          uv run --python ${{ matrix.python }} sficheck -q --format json --skip winget
          --kernel --hypervisors --firmware --hardware > /dev/null
        shell: bash
      - run: uvx --with tox-uv tox -e ${{ matrix.python }}
