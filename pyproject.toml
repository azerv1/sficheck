[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "absolutely-proprietary"
dynamic = ["version"]
description = "Find proprietary software installed through your system and language package managers."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "vmavromatis", email = "bill.mavromatis@protonmail.com" }]
keywords = ["free software", "proprietary", "license", "audit", "parabola", "stallman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "httpx2>=2.9",
]

[dependency-groups]
# What tox installs per Python version; the linters run once, through prek.
test = ["pytest>=8", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0"]
dev = [
    { include-group = "test" },
    "complexipy>=8.0.1",
    "deptry>=0.25.1",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "ruff>=0.6",
    "tox>=4.21",
    "tox-uv>=1",
    "vulture>=2.16",
]

[project.urls]
Homepage = "https://github.com/vmavromatis/absolutely-proprietary"

[project.scripts]
absolutely-proprietary = "absolutely_proprietary.cli:main"

[tool.setuptools.dynamic]
version = { attr = "absolutely_proprietary.__version__" }

[tool.setuptools.packages.find]
include = ["absolutely_proprietary*"]

[tool.setuptools.package-data]
"absolutely_proprietary.data" = ["*.json"]
"absolutely_proprietary.data.lists" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["absolutely_proprietary", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov"  # xdist workers + coverage on every run

[tool.coverage.run]
source = ["absolutely_proprietary"]
parallel = true  # one data file per xdist worker; pytest-cov combines them

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.complexipy]
paths = ["absolutely_proprietary"]  # scripts/ holds one-off maintenance scripts, not core code
max-complexity-allowed = 20  # cli.main sits at 20
failed = true  # list only the functions over the limit

[tool.deptry]
extend_exclude = ["tests", "hooks"]
known_first_party = ["absolutely_proprietary"]

[tool.vulture]
paths = ["absolutely_proprietary", "scripts", "tests"]
min_confidence = 100

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1"]
env_list = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
# Parallel envs (tox -p) would otherwise combine and delete each other's coverage files.
set_env = { COVERAGE_FILE = "{env_tmp_dir}{/}.coverage" }
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
