[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sficheck"
dynamic = ["version"]
description = "Find proprietary software installed through your system and language package managers."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "vmavromatis", email = "bill.mavromatis@protonmail.com" },
    { name = "azerv1", email = "azerv1@users.noreply.github.com" },
]
maintainers = [{ name = "azerv1", email = "azerv1@users.noreply.github.com" }]
keywords = ["free software", "proprietary", "license", "audit", "parabola", "stallman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "httpx2>=2.9",
    "license-expression>=30",
    "msgspec>=0.19",
    "pyudev>=0.24 ; sys_platform == 'linux'",
]

[dependency-groups]
# What tox installs per Python version; the linters run once, through prek.
test = [
    "hypothesis>=6.169.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "test" },
    "complexipy>=8.0.1",
    "deptry>=0.25.1",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "ruff>=0.6",
    "tox>=4.21",
    "tox-uv>=1",
    "vulture>=2.16",
]

[project.urls]
Homepage = "https://github.com/azerv1/sficheck"
Repository = "https://github.com/azerv1/sficheck"
Issues = "https://github.com/azerv1/sficheck/issues"
Upstream = "https://github.com/vmavromatis/absolutely-proprietary"

[project.scripts]
sficheck = "sficheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sficheck.__version__" }

[tool.setuptools.packages.find]
include = ["sficheck*"]

[tool.setuptools.package-data]
"sficheck.data" = ["*.json"]
"sficheck.data.lists" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
platform = "win32"  # the winreg and ctypes code narrows on sys.platform; check it the same way on every OS
files = ["sficheck", "tests", "scripts"]

[[tool.mypy.overrides]]
# Runtime dependencies that ship without type information.
module = ["license_expression", "pyudev"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov"  # xdist workers + coverage on every run

[tool.coverage.run]
source = ["sficheck"]
parallel = true  # one data file per xdist worker; pytest-cov combines them

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.complexipy]
paths = ["sficheck"]  # scripts/ holds one-off maintenance scripts, not core code
max-complexity-allowed = 20  # cli.main sits at 20
failed = true  # list only the functions over the limit

[tool.deptry]
extend_exclude = ["tests", "hooks"]
known_first_party = ["sficheck"]

[tool.vulture]
paths = ["sficheck", "scripts", "tests"]
min_confidence = 100

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1"]
env_list = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
# Parallel envs (tox -p) would otherwise combine and delete each other's coverage files.
set_env = { COVERAGE_FILE = "{env_tmp_dir}{/}.coverage" }
pass_env = ["CI", "HYPOTHESIS_PROFILE"]  # picks the Hypothesis profile (tests/conftest.py)
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "commitizen"  # the version lives in sficheck/__init__.py, read dynamically by setuptools
version = "0.1.0"
version_files = ["sficheck/__init__.py:__version__"]
update_changelog_on_bump = true
major_version_zero = true
