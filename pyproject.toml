[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "absolutely-proprietary"
dynamic = ["version"]
description = "Find proprietary software installed through your system and language package managers."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "vmavromatis", email = "bill.mavromatis@protonmail.com" }]
keywords = ["free software", "proprietary", "license", "audit", "parabola", "stallman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/vmavromatis/absolutely-proprietary"

[project.scripts]
absolutely-proprietary = "absolutely_proprietary.cli:main"

[tool.setuptools.dynamic]
version = { attr = "absolutely_proprietary.__version__" }

[tool.setuptools.packages.find]
include = ["absolutely_proprietary*"]

[tool.setuptools.package-data]
"absolutely_proprietary.data" = ["*.json"]
"absolutely_proprietary.data.lists" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
